# ==============================================================================
# Scentspired Theme Check Configuration (.theme-check.yml)
# Official Shopify Theme Check rules for Scentspired Global Stores
# ==============================================================================

extends: theme-check:recommended

# Ignore vendor bundles, regional packages, tests, docs, and third-party app blocks
ignore:
  - 'node_modules/**'
  - 'regions/**'
  - 'tests/**'
  - 'docs/**'
  - '.github/**'
  - 'assets/*.min.js'
  - 'assets/*.min.css'
  - '.upstream-sync-metadata.json'

# Critical Quality Gates (Strict Errors)
ValidSchemaTranslations:
  enabled: true
  severity: error

LiquidHTMLSyntaxError:
  enabled: true
  severity: error

ParserBlockingScript:
  enabled: true
  severity: error

MissingAsset:
  enabled: true
  severity: error

UnknownFilter:
  enabled: true
  severity: error

# Configurable Rules for Custom Stores
ImgWidthAndHeight:
  enabled: false # Non-blocking asset dimensions checked via Layer 11 budget guard

MatchingTranslations:
  enabled: false # English is primary; international stores translate dynamically

RemoteAsset:
  enabled: false # SEO hreflang alternate links, Google Tag Manager, and external analytics are remote by design

OrphanedSnippet:
  enabled: false # Telemetry, app embeds, and conditional snippets managed across layouts

UndefinedObject:
  enabled: false # Third-party builder & app bridge globals (EComposer, Loox, Ryviu)

UnusedAssign:
  enabled: false # Heavy AST symbol table traversal skipped; covered by Layer 3 static analysis

VariableName:
  enabled: false # Naming convention checked by Layer 3 static analysis
