name: Scentspired Core Theme Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: 7-Layer Core Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Scentspired-Theme
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run 7-Layer Central Quality Gate
        run: node runner.cjs --target=.
