name: Sync Core Updates to Regional Stores

on:
  workflow_run:
    workflows: ["Scentspired Core Theme Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  notify-sync:
    name: Notify Regional Stores of Upstream Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Upstream Release Log
        run: |
          echo "✅ Scentspired-Theme core update verified."
          echo "🇦🇪 UAE: deployed only by hand (auto-update-uae-live.yml, workflow_dispatch)."
          echo "🔒 UK & USA: Strictly locked to READ-ONLY (Zero-Push policy active)."
